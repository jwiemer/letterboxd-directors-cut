# Director's Cut: build a downloadable Chrome zip when a version tag (v*) is pushed,
# and attach it to a GitHub Release. Install it with "Load unpacked" (see README).
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build Chrome and Firefox
        working-directory: src
        run: |
          npm install --no-audit --no-fund
          ./build.sh chrome
          ./build.sh firefox

      - name: Zip
        run: |
          (cd src/dist/chrome && zip -qr "$GITHUB_WORKSPACE/directors-cut-chrome-${GITHUB_REF_NAME}.zip" .)
          (cd src/dist/firefox && zip -qr "$GITHUB_WORKSPACE/directors-cut-firefox-${GITHUB_REF_NAME}.zip" .)

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" directors-cut-*.zip \
            --title "Director's Cut $GITHUB_REF_NAME" \
            --notes "Download directors-cut-chrome-$GITHUB_REF_NAME.zip, unzip it, then load the folder in chrome://extensions with Developer mode > Load unpacked."
